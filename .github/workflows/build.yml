
name: Build ProFiles

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Checkout AFC transport source
        run: |
          git clone --depth 1 https://github.com/TheShad0w777/AirCard-iOS.git AirCard-iOS
          python3 scripts/patch_afc_read.py

      - name: Build AFC transport framework
        run: |
          export IPHONEOS_DEPLOYMENT_TARGET=16.0
          bash AirCard-iOS/build-ios.sh
          cp -R AirCard-iOS/AirliftFFI.xcframework ./AirliftFFI.xcframework

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ProFiles.xcodeproj \
            -scheme ProFiles \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/ProFiles.app build/Payload/
          cd build
          zip -r ProFiles-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProFiles-unsigned-IPA
          path: build/ProFiles-unsigned.ipa
          if-no-files-found: error
