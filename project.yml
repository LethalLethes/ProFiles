name: ProFiles
options:
  bundleIdPrefix: com.procreations
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  ProFiles:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - framework: AirliftFFI.xcframework
        embed: false
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.procreations.profiles
        INFOPLIST_KEY_CFBundleDisplayName: ProFiles
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
